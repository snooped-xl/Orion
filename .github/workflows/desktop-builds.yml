name: Desktop test builds

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  windows:
    name: Windows x64 portable EXE
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable desktop and restore dependencies
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
      - name: Build native Windows smoke application
        run: flutter build windows --release --no-tree-shake-icons --target tool/desktop_smoke.dart
      - name: Prepare offline WebView2 and Visual C++ runtime for smoke
        shell: pwsh
        run: ./scripts/prepare-windows-runtime.ps1
      - name: Exercise real Monaco, bridge and native companion windows
        shell: pwsh
        run: ./scripts/test-desktop-smoke.ps1
      - name: Build normal release entry point
        run: flutter build windows --release --no-tree-shake-icons --target lib/main.dart
      - name: Prepare offline WebView2 and Visual C++ runtime
        shell: pwsh
        run: ./scripts/prepare-windows-runtime.ps1
      - name: Install portable packager
        shell: pwsh
        run: |
          if (-not (Test-Path (Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'))) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
      - name: Package single portable executable
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Launch the actual portable EXE
        shell: pwsh
        run: ./scripts/test-windows-package.ps1
      - name: Upload runnable Windows test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Orion-Windows-x64
          path: |
            dist/Orion.exe
            dist/Orion.exe.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Retain Windows smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Windows-smoke-diagnostics
          path: build/package-smoke/
          if-no-files-found: ignore
          retention-days: 7

  linux:
    name: Linux x64 AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install native and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libepoxy-dev libpng-dev libstdc++-13-dev patchelf desktop-file-utils squashfs-tools xvfb dbus-x11
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Analyze and run Flutter tests
        run: |
          flutter pub get
          flutter analyze
          flutter test --reporter compact
      - name: Build release
        run: ./scripts/build-linux.sh
      - name: Build AppImage
        run: python3 scripts/package-appimage.py
      - name: Validate and launch AppImage
        run: xvfb-run -a dbus-run-session -- python3 scripts/test-appimage.py
      - name: Upload Linux AppImage test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Orion-AppImage-x86_64
          path: |
            dist/Orion-x86_64.AppImage
            dist/Orion-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 30
