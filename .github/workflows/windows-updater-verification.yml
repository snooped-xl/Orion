name: Windows updater verification build

on:
  workflow_dispatch:
    inputs:
      source_version:
        description: Version to report in the local source build for a real GUI update to a newer published release
        type: string
        default: '1.13.9'
        required: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Set the local source version
        shell: pwsh
        env:
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          if ($env:SOURCE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a numeric semantic version' }
          $path = 'lib/services/auto_update_service.dart'
          (Get-Content $path -Raw) -replace "defaultCurrentVersion = '[^']+'", "defaultCurrentVersion = '$env:SOURCE_VERSION'" | Set-Content $path -NoNewline
          (Get-Content pubspec.yaml -Raw) -replace '(?m)^version: .*$', "version: $env:SOURCE_VERSION+1" | Set-Content pubspec.yaml -NoNewline
      - name: Test updater startup on native Windows
        shell: pwsh
        run: |
          flutter pub get
          flutter test test/auto_update_service_test.dart --reporter expanded
          if ($LASTEXITCODE -ne 0) { throw 'Updater tests failed' }
      - name: Build the actual desktop app
        shell: pwsh
        run: ./scripts/build-windows-ci.ps1
      - name: Prepare offline runtime
        shell: pwsh
        run: ./scripts/prepare-windows-runtime.ps1
      - name: Package portable EXE
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Orion-Windows-updater-source
          path: |
            dist/Orion.exe
            dist/Orion.exe.sha256
            build/windows/x64/runner/Release/data/app.so
          if-no-files-found: error
          retention-days: 7
